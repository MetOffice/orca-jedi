name: Cleanup old container images

# Run monthly on the first day at 2 AM UTC
on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_suffix: [gcc, clang]
    permissions:
      packages: write
      contents: read

    steps:
      - name: Delete old branch-based container images (${{ matrix.image_suffix }})
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail

          owner="twsearle"
          package_name="orca-jedi/ci-almalinux9-${{ matrix.image_suffix }}"
          encoded_package_name="${package_name//\//%2F}"
          cutoff="$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)"

          api_base="https://api.github.com"
          page=1
          ids_to_delete=""

          while :; do
            response_file="$(mktemp)"
            status_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_base}/users/${owner}/packages/container/${encoded_package_name}/versions?per_page=100&page=${page}")"

            if [[ "$status_code" == "404" ]]; then
              echo "Package not found: ${package_name}. Skipping."
              rm -f "$response_file"
              exit 0
            fi

            if [[ "$status_code" != "200" ]]; then
              echo "Failed to list package versions for ${package_name} (HTTP ${status_code})."
              cat "$response_file"
              rm -f "$response_file"
              exit 1
            fi

            page_ids="$(jq -r --arg cutoff "$cutoff" '
                .[]
                | select(.updated_at < $cutoff)
                | select((.metadata.container.tags // []) | map(test("^v")) | any | not)
                | .id
              ' "$response_file")"

            if [[ -n "$page_ids" ]]; then
              ids_to_delete+=$'\n'"$page_ids"
            fi

            page_count="$(jq 'length' "$response_file")"
            rm -f "$response_file"

            if [[ "$page_count" -lt 100 ]]; then
              break
            fi

            page=$((page + 1))
          done

          ids_to_delete="${ids_to_delete#$'\n'}"

          if [[ -z "$ids_to_delete" ]]; then
            echo "No matching old versions found for ${package_name}."
            exit 0
          fi

          while read -r version_id; do
            [[ -z "$version_id" ]] && continue
            echo "Deleting package version ${version_id} for ${package_name}"
            gh api -X DELETE "users/${owner}/packages/container/${encoded_package_name}/versions/${version_id}"
          done <<< "$ids_to_delete"
