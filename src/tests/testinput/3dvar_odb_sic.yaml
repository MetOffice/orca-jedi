cost function:
  cost type: 3D-Var
  time window:
    begin: '2021-06-29T00:00:00Z'
    length: P1D
  analysis variables: [ice_area_fraction]
  background error:
    covariance model: SABER
    saber central block:
      saber block name: BUMP_NICAS
      read:
        general:
          testing: true
        io:
          data directory: Data
          files prefix: dirac_my_bump_nicas/orca2
          overriding nicas file: orca2_my_bump_files_nicas
          parallel netcdf: true
        drivers:
          multivariate strategy: univariate
          # read global nicas: true
          read local nicas: true
        model:
          do not cross mask boundaries: true
        nicas:
          explicit length-scales: true
          horizontal length-scale:
          - groups: 
            - ice_area_fraction
            value: 1000.0e+3 #works, needs to be the same as in bump_nicas_setup
          vertical length-scale:
          - groups:
            - ice_area_fraction 
            value: 10
      msvalr: 1e30
    saber outer blocks:
    - saber block name: BUMP_StdDev
      read:
        general:
          testing: true
        io:
          data directory: Data
          files prefix: orca2
        drivers:
          compute variance: true
        variance:
          explicit stddev: true
          stddev:
          - variables:
            - ice_area_fraction
            value: 1
      msvalr: 1e30
  geometry: &Geom
    nemo variables:
      - name: ice_area_fraction
        nemo field name: iiceconc
        model space: surface
        field precision: double
      - name: sea_surface_temperature
        nemo field name: votemperh
        model space: surface
        field precision: double
      - name: sea_water_potential_temperature
        nemo field name: votemper
        model space: volume
        field precision: double
      - name: ice_area_fraction_background_error
        nemo field name: sic_tot_var
        model space: surface
        variable type: background variance
        field precision: double
    grid name: ORCA2_T
    number levels: 10
    initialise extra fields: true
    partitioner: checkerboard 
  background:
    date: 2021-06-29T12:00:00Z
    state variables: [ ice_area_fraction ]
    nemo field file: Data/orca2_t_nemo.nc
    set gmask: true
  observations:
    observers:
    - obs space:
        name: Sea Ice
        obsdatain:
          engine:
            type: ODB
            obsfile: Data/hofx_sic_ostia_obs.odb
            mapping file: testinput/odb_sic_mapping.yaml
            query file: testinput/odb_sic_query.yaml
        obsdataout:
          engine:
            type: H5File
            obsfile: testoutput/obsdataout_3dvar_ostia_odb_sic.nc
        simulated variables: [ice_area_fraction]
      get values:
        time interpolation: linear
        atlas-interpolator:
          type: unstructured-bilinear-lonlat
          non_linear: missing-if-any-missing
          max_fraction_elems_to_try: 0.0
          adjoint: true
      obs operator:
        name: Composite
        components:
        - name: Identity
          observation alias file: testinput/test_name_map.yaml
        - name: BackgroundErrorIdentity
          observation alias file: testinput/test_name_map.yaml
      obs error:
        covariance model: diagonal
      obs filters:
      - filter: Perform Action
        filter variables:
        - name: seaIceFraction
        action:
          name: assign error
          error parameter: 0.3162277
      - filter: RejectList
        defer to post: true
        where:
        - variable:
            name: ObsValue/seaIceFraction
          value: is_not_valid
        actions:
        - name: set
          flag: FinalReject
        - name: set
          flag: ObNotDefinedReject
        - name: reject
      - filter: RejectList
        defer to post: true
        where:
        - variable:
            name: HofX/seaIceFraction
          value: is_not_valid
        actions:
        - name: set
          flag: FinalReject
        - name: set
          flag: BgNotDefinedReject
        - name: reject
      - filter: Bounds Check
        defer to post: true
        filter variables:
        - name: seaIceFraction
        minvalue: 0.0
        maxvalue: 1.0
        actions:
        - name: set
          flag: FinalReject
        - name: set
          flag: ObOutOfBoundsReject
        - name: reject
      - filter: Bounds Check
        defer to post: true
        filter variables:
        - name: HofX/seaIceFraction
        minvalue: 0.0
        maxvalue: 1.0
        actions:
        - name: set
          flag: FinalReject
        - name: set
          flag: BgOutOfBoundsReject
        - name: reject
      - filter: Bayesian Background Check
        observation alias file: testinput/test_name_map.yaml
        filter variables:
        - name: seaIceFraction
        prob density bad obs: 1.0
        PGE threshold: 0.5
        actions:
        - name: set
          flag: FinalReject
        - name: set
          flag: BayBgCheckReject
        - name: reject
      - filter: NEMO Feedback Writer
        filename: odb_nemo_fdbk_writer_out.nc
        reference date: 1950-01-01T00:00:00Z
        variables:
        - name: seaIceFraction
          nemo name: ICECONC
          long name: ice area fraction
          units: Fraction
          additional variables:
            - name: seaIceFraction
              feedback suffix: Hx
              ioda group: HofX
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 2
    gradient norm reduction: 1e-30
    geometry: *Geom
    test: on
    online diagnostics:
      write increment: true
      increment:
        state component:
          output path: testoutput/increments_3dvar_odb_sic.nc
          date: 2021-06-30T00:00:00Z
final:
  diagnostics:
    departures: oman
output:
  date: 2021-06-30T00:00:00Z
  state variables: [ ice_area_fraction ]
  nemo field file: testoutput/3dvar_sic2.nc
  output nemo field file: testoutput/analysis_3dvar_odb_sic.nc
test:
  reference filename: testoutput/test_3dvar_odb_sic.ref
  test output filename: testoutput/test_3dvar_odb_sic.out
