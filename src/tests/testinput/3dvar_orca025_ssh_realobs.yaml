cost function:
  cost type: 3D-Var
  time window:
    # begin: '2021-06-29T00:00:00Z'
    begin: '2025-01-09T00:00:00Z'
    length: P1D
  analysis variables: [sea_surface_height_anomaly]
  background error:
    covariance model: SABER
    saber central block:
      saber block name: BUMP_NICAS
      read:
        general:
          testing: true
        io:
          data directory: Data
          files prefix: dirac_my_bump_nicas/orca025_ssh
          overriding nicas file: orca025_ssh_my_bump_files_nicas
          parallel netcdf: true
        drivers:
          multivariate strategy: univariate
          # read global nicas: true
          read local nicas: true
        model:
          do not cross mask boundaries: true
        nicas:
          explicit length-scales: true
          horizontal length-scale:
          - groups: 
            - sea_surface_height_anomaly
            value: 400.0e+3 
          vertical length-scale:
          - groups:
            - sea_surface_height_anomaly
            value: 10
      msvalr: 1e30
    saber outer blocks:
    - saber block name: BUMP_StdDev
      read:
        general:
          testing: true
        io:
          data directory: Data
          files prefix: orca025_ssh
        drivers:
          compute variance: true
        variance:
          explicit stddev: true
          stddev:
          - variables:
            - sea_surface_height_anomaly
            value: 0.1
      msvalr: 1e30
  geometry: &Geom
    nemo variables:
      - name: sea_surface_height_anomaly
        nemo field name: sossheig
        model space: surface
        field precision: double
    grid name: eORCA025_T
    number levels: 1
    initialise extra fields: true
    partitioner: checkerboard 
  background:
    date: 2025-01-09T12:00:00Z
    state variables: [ sea_surface_height_anomaly ]
    nemo field file: Data/orca025ext_t_mersea_nemo.nc
    set gmask: true
  observations:
    observers:
    - obs space:
        name: Sea Surface Height 
        obsdatain:
          engine:
            type: H5File
            obsfile: Data/orca025ext_sla-multi-multi-jopa_20250109T0000Z.nc
        obsdataout:
          engine:
            type: H5File
            obsfile: testoutput/obsdataout_3dvar_orca025_ssh_realobs.nc
        simulated variables: [seaSurfaceHeightAnomaly]
      get values:
        time interpolation: linear
        atlas-interpolator:
          type: unstructured-bilinear-lonlat
          non_linear: missing-if-any-missing
          adjoint: true
      obs operator: 
        name: Composite
        components:
        - name: Identity
          observation alias file: testinput/test_name_map.yaml
      obs error:
        covariance model: diagonal
      # no derived obs errors for seaSurfaceHeightAnomaly
      obs pre filters:
      - filter: Variable Assignment
        assignments:
        - name: DerivedObsValue/seaSurfaceHeightAnomaly
          type: float
          function:
            name: ObsFunction/LinearCombination
            options:
              variables: [ObsValue/seaSurfaceHeightAnomaly, DerivedObsValue/mdt]
              coefs: [1.0, 1.0]
              # adding MDT to obs
      - filter: Perform Action
        filter variables: [{name: seaSurfaceHeightAnomaly}]
        action:
          name: assign error
          error parameter: 0.1
      obs post filters:
      - filter: Background Check
        filter variables: [{name: seaSurfaceHeightAnomaly}]
        absolute threshold: 2.0
        # manually set the absolute threshold for sea surface height anomaly observations
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 2
    gradient norm reduction: 1e-30
    geometry: *Geom
    test: on
    online diagnostics:
      write increment: true
      increment:
        state component:
          output path: testoutput/increments_3dvar_orca025_ssh_realobs.nc
          date: 2025-01-09T00:00:00Z
final:
  diagnostics:
    departures: oman
output:
  date: 2025-01-09T00:00:00Z
  state variables: [ sea_surface_height_anomaly ]
  nemo field file: testoutput/3dvar_orca025_ssh_realobs.nc
  output nemo field file: testoutput/analysis_3dvar_orca025_ssh_realobs.nc
test:
  reference filename: testoutput/test_3dvar_orca025_ssh_realobs.ref
  test output filename: testoutput/test_3dvar_orca025_ssh_realobs.out
  float absolute tolerance: 5.0e-7 # tolerance for MPI sum-order related differences

